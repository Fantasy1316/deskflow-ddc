name: Tauri Build
on:
  workflow_dispatch:
  push:
    branches: ['main', 'upgrade/tauri-v0.2']
    tags: ['v0.2.*', 'v0.3.*']
  pull_request:
    paths:
      [
        'src/**',
        'src-tauri/**',
        'native/**',
        'scripts/**',
        'package.json',
        'pnpm-lock.yaml',
        '.github/workflows/tauri.yml',
        'resources/**',
        'tests/**',
        'tsconfig*.json',
        'vite.config.ts',
        'pnpm-workspace.yaml',
      ]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundle: app
            name: macos-arm64
          - os: windows-latest
            bundle: nsis
            name: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      # Keep Tauri's official source and hash checks, but request fresh release redirects.
      TAURI_BUNDLER_TOOLS_GITHUB_MIRROR_TEMPLATE: https://github.com/<owner>/<repo>/releases/download/<version>/<asset>?deskflow-ddc-ci=${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .engine-cache
          key: engine-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('scripts/prepare-engine*.mjs', 'scripts/download-verified.mjs') }}
      - run: node --test scripts/download-verified.test.mjs
      - run: pnpm prepare:engine
      - run: pnpm typecheck
      - run: pnpm build:web
      - run: pnpm test
      - if: runner.os == 'macOS'
        run: pnpm test:native
      - if: runner.os == 'Windows'
        run: node scripts/test-windows-native.mjs
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test bundled_runtime -- --ignored
      - run: pnpm build:tauri --bundles ${{ matrix.bundle }}
      - if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent 'src-tauri/target/release/bundle/macos/Deskflow DDC.app' 'Deskflow-DDC-macos-arm64.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: deskflow-ddc-${{ matrix.name }}
          path: |
            Deskflow-DDC-*.zip
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
