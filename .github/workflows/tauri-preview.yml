name: Tauri Preview
on:
  workflow_dispatch:
  push:
    branches: ['upgrade/tauri-v0.2']
  pull_request:
    paths:
      [
        'src/**',
        'src-tauri/**',
        'native/**',
        'scripts/**',
        'package.json',
        'pnpm-lock.yaml',
        '.github/workflows/tauri-preview.yml',
      ]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundle: app
            name: macos-arm64
          - os: windows-latest
            bundle: nsis
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm prepare:engine
      - run: pnpm build:web
      - run: pnpm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test bundled_runtime -- --ignored
      - run: pnpm build:tauri --bundles ${{ matrix.bundle }}
      - if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent 'src-tauri/target/release/bundle/macos/Deskflow DDC Preview.app' 'Deskflow-DDC-Preview-macos-arm64.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: deskflow-ddc-preview-${{ matrix.name }}
          path: |
            Deskflow-DDC-Preview-*.zip
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
